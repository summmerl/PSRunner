plugins {
    id 'java'
    id 'org.jetbrains.intellij.platform' version '2.18.1'
}

group = 'com.summerlex.psrunner'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)   // 2026.1 SDK 为 Java 21 字节码（65.0），编译 JDK 须 ≥21
    }
}

compileJava {
    options.release = 21          // 产出 65 字节码；sinceBuild=261 的 IDE 均自带 JBR≥21，可正常加载
    options.encoding = 'UTF-8'    // 源文件含中文注释；Windows 默认 GBK 会导致「不可映射字符」编译失败
}

repositories {
    maven {
        name = '阿里云公共仓库'
        url = 'https://maven.aliyun.com/repository/public'
    }
    maven {
        name = '阿里云谷歌仓库'
        url = 'https://maven.aliyun.com/repository/google'
    }
    mavenCentral()                                        // 解析标准 JVM 库
    intellijPlatform {
        defaultRepositories()                             // JetBrains 托管仓库（下载 SDK）
    }
}

dependencies {
    intellijPlatform {
        intellijIdea '2026.1'                              // 2026.1 起仅发布 Ultimate（IU）；Community 已于 2025.3 停发
                                                          // （Community 沙盒；要测 Ultimate 改 intellijIdea）
        jetbrainsRuntime()                                // 多平台压缩包不含 JBR，需显式声明运行时供 runIde 用
    }
}

intellijPlatform {
    projectName = 'PowerShell Script Runner'

    pluginConfiguration {
        ideaVersion {
            sinceBuild = '261'                            // 2026.1 起始 build 号（251/252/253→261）
            untilBuild = '261.*'                          // 兼容上限：仅 2026.1 系列（仅实测过 2026.1；验证更多版本后再放宽）
        }
    }
}

buildSearchableOptions.enabled = false   // 本插件无 Configurable 设置页，跳过耗时的搜索索引构建
                                         // （备选：gradle.properties 设 org.jetbrains.intellij.buildFeature.buildSearchableOptions=false）

runIde {
    jvmArgs '-Xmx2g'
}

// verifyPlugin 为 2.x 标准任务：跑 Plugin Verifier 校验二进制兼容性
// 要校验的 IDE 版本在 intellijPlatform { pluginVerification { ides { } } } 中声明（见兼容性自查清单）
